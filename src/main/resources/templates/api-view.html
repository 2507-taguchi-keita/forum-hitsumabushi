<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/style-api.css}" rel="stylesheet">
    <title>掲示板(API)</title>
</head>
<body class="api-view">
    <h1 class="api-title">掲示板(API)</h1>
    <!-- リロードボタン -->
    <button class="api-reload-btn" onclick="loadMessages()">最新の投稿を読み込む</button>
    <div class="btn-re">
        <form action="/forum-hitsumabushi" method="get">
            <button class="btn" type="submit">戻る</button>
        </form>
    </div>
    <div id="postList"></div>
    <div id="pagination" class="api-pagination"></div>
    <script>
        function loadMessages(page = 0) {
            fetch(`/api/messages?page=${page}`)
                .then(response => response.json())
                .then(data => {
                    const postListDiv = document.getElementById("postList");
                    postListDiv.innerHTML = "";

                    data.content.forEach(post => {
                        const postElement = document.createElement("div");
                        postElement.classList.add("api-post-card");
                        postElement.innerHTML = `
                            <div class="api-post-header">
                                <div class="api-post-user">
                                    <span class="api-username">${post.account}</span>
                                    <span class="api-date">${new Date(post.createdDate).toLocaleString()}</span>
                                </div>
                            </div>
                            <div class="api-post-content">
                                <h3 class="api-post-title">${post.title}</h3>
                                <p class="api-post-text">${post.text}</p>
                            </div>
                            <div id="comments-${post.id}" class="api-comment-list">
                                <em>コメント読み込み中...</em>
                            </div>
                        `;
                        postListDiv.appendChild(postElement);

                        loadComments(post.id);
                    });

                    // ページネーション
                    const paginationDiv = document.getElementById("pagination");
                    paginationDiv.innerHTML = "";
                    for (let i = 0; i < data.totalPages; i++) {
                        const btn = document.createElement("button");
                        btn.innerText = i + 1;
                        // ここで「今いるページ番号」なら active クラスを追加
                        if (i === page) {
                            btn.classList.add("active");
                        }
                        btn.onclick = () => loadMessages(i);
                        paginationDiv.appendChild(btn);
                    }
                });
        }

        function loadComments(messageId) {
            fetch(`/api/messages/${messageId}/comments`)
                .then(response => response.json())
                .then(comments => {
                    const commentDiv = document.getElementById(`comments-${messageId}`);
                    commentDiv.innerHTML = "<h4>コメント</h4>";

                    if (comments.length === 0) {
                        commentDiv.innerHTML += "<p>コメントはまだありません</p>";
                        return;
                    }

                    comments.forEach(comment => {
                        const c = document.createElement("div");
                        c.classList.add("api-comment-card");
                        c.innerHTML = `
                            <span class="api-comment-user">${comment.account}</span>
                            <span class="api-comment-date">${new Date(comment.createdDate).toLocaleString()}</span>
                            <p class="api-comment-text">${comment.text}</p>
                        `;
                        commentDiv.appendChild(c);
                    });
                });
        }

        window.onload = () => loadMessages(0);
    </script>
</body>
</html>
